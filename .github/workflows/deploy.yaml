name: Build and Deploy

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          IMAGE_TAG=${{ github.sha }}
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/storefront-api:$IMAGE_TAG .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/storefront-api:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{ secrets.AKS_RESOURCE_GROUP }} --name ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy via Helm
        run: |
          helm upgrade storefront-api ./chart -n storefront \
            -f ./chart/values-aks.yaml \
            --set image.tag=$IMAGE_TAG
