apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: storefront-api
  description: Product catalog and order management API for the storefront demo.
  annotations:
    github.com/project-slug: thlai15/storefront-api
    grafana/alert-label-selector: "service=storefront-api"
    grafana/dashboard-selector: "tags @> 'storefront-api'"
  tags:
    - fastapi
    - python
spec:
  type: service
  lifecycle: experimental
  owner: group:backend-team
  system: storefront
  providesApis:
    - storefront-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: storefront-api
  description: API for the storefront service
spec:
  type: openapi
  lifecycle: experimental
  owner: group:backend-team
  system: storefront
  definition: |
    openapi: 3.0.0
    info:
      title: Storefront API
      version: 1.0.0
    paths:
      /products:
        get:
          summary: List products
          responses:
            '200':
              description: A list of products
      /health:
        get:
          summary: Health check
          responses:
            '200':
              description: Service is healthy
      /order:
        post:
          summary: Create an order
          requestBody:
            description: Order details
            required: true
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    productId:
                      type: string
                    quantity:
                      type: integer
          responses:
            '201':
              description: Order created successfully
            '400':
              description: Invalid order request


